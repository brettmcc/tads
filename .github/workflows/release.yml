# Builds the installers for every supported OS and attaches them to the
# GitHub Release that triggered the workflow. electron-builder can only
# target the OS it runs on, so each platform gets its own runner.
#
#   windows-latest -> NSIS installer (.exe) + blockmap + latest.yml,
#                     portable zip
#   macos-latest   -> dmg + zip for arm64 and x64 (unsigned, unnotarized)
#   ubuntu-latest  -> deb + rpm + tar.bz2
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (e.g. v0.16.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # one platform failing shouldn't discard the installers of the others
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # electron-builder shells out to rpmbuild for the rpm target
      - name: Install rpm tooling
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build

      - name: Build Windows installer
        if: matrix.name == 'windows'
        run: npm run dist:win -w packages/tad-app

      # The unpacked app plus an empty "data" folder, which switches Tads to
      # portable mode (app/portable.ts): it runs without installing and keeps
      # its settings and caches in that folder.
      - name: Build Windows portable zip
        if: matrix.name == 'windows'
        run: |
          V=$(node -p "require('./packages/tad-app/package.json').version")
          cd packages/tad-app/release
          rm -rf Tads
          cp -r win-unpacked Tads
          mkdir Tads/data
          7z a -tzip "Tads-$V-portable-win-x64.zip" Tads

      - name: Build macOS installers (arm64 + x64)
        if: matrix.name == 'macos'
        # invoke the workspace script directly: args after -- don't survive
        # the root script's nested "npm run -w" indirection
        run: npm run dist:mac -w packages/tad-app -- --arm64 --x64
        env:
          # unsigned build: no signing identity, and tools/notarize.js
          # skips notarization when APPLEID is not set
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Linux installers
        if: matrix.name == 'linux'
        run: npm run dist:linux -w packages/tad-app

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          shopt -s nullglob
          V=$(node -p "require('./packages/tad-app/package.json').version")
          cd packages/tad-app/release
          case "${{ matrix.name }}" in
            windows) assets=(*.exe *.exe.blockmap latest.yml *-portable-win-x64.zip) ;;
            macos)   assets=(*.dmg *.dmg.blockmap *-mac.zip *-mac.zip.blockmap latest-mac.yml) ;;
            linux)   assets=(*.deb *.rpm *.tar.bz2 latest-linux*.yml) ;;
          esac
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no installers found in $(pwd)" >&2
            ls -la >&2
            exit 1
          fi

          # Version-less copies so that
          # https://github.com/brettmcc/tads/releases/latest/download/<name>
          # is a permalink to the current installer (that URL only resolves
          # when the asset name is identical in every release). Copies, not
          # renames: electron-updater's latest*.yml refers to the versioned
          # names, so those must stay attached too.
          # $1 is a glob, since electron-builder's on-disk names vary by
          # platform (the NSIS installer is "Tads Setup <v>.exe" with
          # spaces; GitHub is what renders those spaces as dots).
          stable() {
            local matches=($1)
            if [ ${#matches[@]} -ne 1 ]; then
              echo "expected exactly one match for '$1', got ${#matches[@]}: ${matches[*]}" >&2
              ls -la >&2
              exit 1
            fi
            cp "${matches[0]}" "$2"
            assets+=("$2")
          }
          case "${{ matrix.name }}" in
            windows)
              stable "Tads*Setup*$V.exe"     "Tads-Setup-windows-x64.exe"
              stable "Tads-$V-portable-win-x64.zip" "Tads-portable-windows-x64.zip" ;;
            macos)
              stable "Tads-$V-arm64.dmg"     "Tads-macos-arm64.dmg"
              stable "Tads-$V.dmg"           "Tads-macos-x64.dmg" ;;
            linux)
              stable "tads_${V}_amd64.deb"   "Tads-linux-amd64.deb"
              stable "tads-$V.x86_64.rpm"    "Tads-linux-x86_64.rpm"
              stable "tads-$V.tar.bz2"       "Tads-linux-x64.tar.bz2" ;;
          esac

          printf 'uploading: %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber
